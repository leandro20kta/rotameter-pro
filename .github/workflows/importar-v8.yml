name: Importar pacote RotaMeter PRO V8.1
on:
  push:
    branches: [main]
    paths:
      - RotaMeter_PRO_V8_1_IMPORTAR_GITHUB.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Ler repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar e importar projeto
        shell: bash
        run: |
          set -euo pipefail
          archive="RotaMeter_PRO_V8_1_IMPORTAR_GITHUB.zip"
          test -f "$archive"
          unzip -tq "$archive"
          if unzip -Z1 "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Caminho inseguro no ZIP"; exit 1
          fi
          mkdir -p .rotameter-import
          unzip -q "$archive" -d .rotameter-import
          test -f .rotameter-import/web/index.html
          test -f .rotameter-import/web/app.js
          test -f .rotameter-import/ios-native/project.yml
          rsync -a --exclude='/.github/' --exclude='/.git/' .rotameter-import/ ./
          rm -rf .rotameter-import
          git rm -f "$archive"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Importar projeto completo RotaMeter PRO V8.1"
            git push origin HEAD:main
          fi
